<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Compact platoon controller concept</title>
  <desc id="desc">Single-column controller scheme: context and trusted estimates feed a platoon controller, which generates longitudinal acceleration and lateral steering commands for a 2D bicycle model.</desc>

  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.7; }
      .green { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.5; }
      .amber { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; }
      .head { font: 700 17px Arial, Helvetica, sans-serif; fill: #111827; }
      .text { font: 400 13px Arial, Helvetica, sans-serif; fill: #334155; }
      .math { font: 600 13px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .flowGray { fill: none; stroke: #475569; stroke-width: 2.0; marker-end: url(#arrowGray); }
      .flowBlue { fill: none; stroke: #2563eb; stroke-width: 2.3; marker-end: url(#arrowBlue); }
      .flowGreen { fill: none; stroke: #15803d; stroke-width: 2.3; marker-end: url(#arrowGreen); }
      .feedback { fill: none; stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 7 6; marker-end: url(#arrowGray); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="300"/>

  <rect class="box" x="22" y="62" width="150" height="130" rx="8"/>
  <text class="head" x="42" y="94">Context</text>
  <text class="text" x="42" y="122">formation/order</text>
  <text class="text" x="42" y="146">spacing d,h</text>
  <text class="text" x="42" y="170">trusted estimates</text>

  <rect class="blue" x="210" y="52" width="190" height="150" rx="8"/>
  <text class="head" x="234" y="84">Platoon controller</text>
  <text class="text" x="234" y="116">gap, relative speed</text>
  <text class="text" x="234" y="140">trust gate gamma_i</text>
  <text class="text" x="234" y="164">path errors</text>

  <rect class="box" x="440" y="52" width="140" height="150" rx="8"/>
  <text class="head" x="462" y="84">Commands</text>
  <rect class="green" x="462" y="104" width="96" height="34" rx="6"/>
  <text class="math" x="482" y="126">a_i</text>
  <rect class="amber" x="462" y="152" width="96" height="34" rx="6"/>
  <text class="math" x="476" y="174">delta_i</text>

  <rect class="box" x="622" y="62" width="116" height="130" rx="8"/>
  <text class="head" x="644" y="94">2D bicycle</text>
  <text class="text" x="644" y="122">X,Y,psi,v</text>
  <text class="text" x="644" y="150">state update</text>
  <text class="math" x="644" y="176">feedback</text>

  <path class="flowGray" d="M 172 127 L 210 127"/>
  <path class="flowBlue" d="M 400 127 L 440 127"/>
  <path class="flowGreen" d="M 580 127 L 622 127"/>
  <path class="feedback" d="M 680 192 L 680 258 L 97 258 L 97 192"/>
</svg>
